name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-care-runner
    steps:
      - uses: actions/checkout@v4
      - name: Create backend environment file
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || '3306' }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          umask 077
          python3 - <<'PY'
          import os
          from pathlib import Path

          names = ("DB_HOST", "DB_PORT", "DB_USER", "DB_PASSWORD", "DB_NAME")
          lines = []
          for name in names:
              value = os.environ[name]
              if "\n" in value or "\r" in value:
                  raise ValueError(f"{name} cannot contain a newline")
              escaped = value.replace("\\", "\\\\").replace("'", "\\'")
              lines.append(f"{name}='{escaped}'\n")
          Path(".env").write_text("".join(lines))
          PY

      - name: Stop and remove existing containers
        run: |
          docker compose down || true

      - name: Build and start services
        run: docker compose up -d --build
