services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: selfcare-backend
    restart: always
    environment:
      PORT: 5000
      DB_HOST: ${DB_HOST:?Set DB_HOST in the selected env file}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:?Set DB_USER in the selected env file}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the selected env file}
      DB_NAME: ${DB_NAME:?Set DB_NAME in the selected env file}
    networks:
      - selfcare-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: selfcare-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - selfcare-network

networks:
  selfcare-network:
    driver: bridge
